# 每 6 小时同步 GitHub topic:dsh-plugin -> site/public/data/*.json
# 数据 commit 后 Cloudflare Pages 自动重建静态站。
name: sync
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run sync pipeline
        run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): sync dsh-plugin directory"
          file_pattern: "site/public/data/*.json"
