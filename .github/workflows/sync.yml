# 每 6 小时同步 GitHub topic:dsh-plugin -> site/public/data/*.json
# 数据 commit 后 Cloudflare Pages 自动重建静态站。
name: sync
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    # 同步脚本 90 分钟内必须完成；防止异常（如限流死循环）占用 runner 数小时。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 无需配置 secret：Actions 自动注入的内置 GITHUB_TOKEN 已满足搜索 API 额度（30 次/分钟）
      - name: Run sync pipeline
        run: node scripts/sync.mjs
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): sync dsh-plugin directory"
          file_pattern: "site/public/data/*.json"